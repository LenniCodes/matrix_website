<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="lib/gif-encoder.bundle.js"></script>
    <script type="text/javascript" src="control.js" defer></script>
    <script type="text/javascript" src="canvas.js" defer></script>
    <script type="text/javascript" src="style_enhance.js" defer></script>
    <script type="text/javascript" src="render.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div id="overlay">
        <div class="loader"></div>
    </div>
    <button id="export-button">Export</button>

    <div id="operation-space">
        <div id="drawing-canvas-container">
            <canvas width="10px" height="10px" id="drawing-canvas"></canvas>
        </div>
        <div id="tool-bar">
            <div id="color-picker-container">
                <label for="color-picker" class="tool-button" id="color-button"><img src="assets/icons/color_lens.svg" id="color-icon"></label>
                <input type="color" id="color-picker" value="#ff0000">
            </div> 
            <div class="tool-button" id="pencil-button"><img src="assets/icons/edit.svg"></div>
            <div class="tool-button" id="brush-button"><img src="assets/icons/brush.svg"></div>
            <div class="tool-button" id="fill-button"><img src="assets/icons/format_color_fill.svg"></div>
            <div class="tool-button" id="line-button"><img src="assets/icons/show_chart.svg"></div>
            <div class="tool-button" id="circle-button"><img src="assets/icons/radio_button_unchecked.svg"></div>
        </div>
        <div id="undo-bar">
            <div class="tool-button" id="undo-button"><img src="assets/icons/undo.svg"></div>
            <div class="tool-button" id="redo-button"><img src="assets/icons/redo.svg"></div>
            <div class="tool-button" id="eraser-button"><img src="assets/icons/backspace.svg"></div> 
            <div class="tool-button" id="reset-button"><img src="assets/icons/delete.svg"></div>
        </div>
    </div>

    <div id="frame-list-container">
        <div id="frame-list">
            <div id="frames"></div>
            <div id="add-frame"><img src="assets/icons/add.svg"></div>
        </div>
        <div id="gradient-left"></div>
        <div id="gradient-right"></div>
    </div>

    <div class ="control-buttons">
        <button id="previous-button"><img src="assets/icons/skip_previous.svg"></button>
        <button id="play-button"><img src="assets/icons/play_arrow.svg"></button>
        <button id="next-button"><img src="assets/icons/skip_next.svg"></button>
    </div>

    <div id="context-menu">
        <div class="item" id="menu-duplicate">Duplicate</div>
        <div class="item" id="menu-delete">Delete</div>
    </div>

    <template id="preview-template">
        <div class="preview-frame">
            <canvas class="preview-canvas" width="10px" height="10px"></canvas>
            <img src="assets/settings_icon.png" class="settings-icon" width="30px">
        </div>
    </template>

</body>
